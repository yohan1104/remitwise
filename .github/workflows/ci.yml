name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  contract:
    name: Soroban contract tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts/savings-vault
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts/savings-vault
      - name: cargo test
        run: cargo test --locked

  app:
    name: App unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Unit tests
        run: npm test
      - name: Typecheck
        run: npx tsc --noEmit
